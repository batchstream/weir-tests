name: Database saturation benchmark

on:
  workflow_dispatch:
    inputs:
      write-percent:
        description: Deterministic write percentage (0 read, 10 mixed, 100 write)
        default: '0'
        required: true
        type: choice
        options: ['0', '10', '100']
      database-cpus:
        description: CPU quota for each owned database, identical for both paths
        default: '1'
        required: true
        type: choice
        options: ['1', '0.5', '2']
      client-levels:
        description: Total concurrency across four independent client processes
        default: '4,8,32,128,256'
        required: true
        type: string
      backend-batch-limit:
        description: Server adapter grouping limit (1 disables cross-RPC aggregation)
        default: '32'
        required: true
        type: choice
        options: ['32', '128', '256', '1', '1,32', '32,128,256']
      lua-mutations:
        description: Compare native single-record RMW with server-batched Lua mutations
        default: false
        required: true
        type: boolean
      backend:
        description: Owned database backend
        default: all
        required: true
        type: choice
        options: [all, mongo, search]
      mode:
        description: Single-record business requests or supplemental client bulk calls
        default: saturation
        required: true
        type: choice
        options: [saturation, bulk-saturation]
      batch-sizes:
        description: Records per call; saturation requires 1, bulk-saturation accepts 1 through 64
        default: '1'
        required: true
        type: string
  pull_request:
    paths-ignore:
      - 'results/**'

permissions:
  contents: read

concurrency:
  group: saturation-${{ github.ref }}-${{ inputs.write-percent || 'matrix' }}-${{ inputs.database-cpus || '1' }}-${{ inputs.client-levels || '4,8,32,128,256' }}-${{ inputs.backend-batch-limit || '32' }}-${{ inputs.lua-mutations || false }}-${{ inputs.backend || 'all' }}-${{ inputs.mode || 'saturation' }}-${{ inputs.batch-sizes || '1' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  database-full-load:
    strategy:
      fail-fast: false
      matrix:
        write-percent: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{0}]', inputs.write-percent) || '[0,10,100]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Prepare immutable tools and owned database images
        run: |
          python3 scripts/download_modules.py
          python3 scripts/prepare_weir.py
          python3 scripts/prepare_images.py
      - name: Independent single-request native and SDK clients
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          WRITE_PERCENT: ${{ matrix.write-percent }}
          DATABASE_CPUS: ${{ inputs.database-cpus || '1' }}
          CLIENT_LEVELS: ${{ inputs.client-levels || '4,8,32,128,256' }}
          BACKEND_BATCH_LIMITS: ${{ inputs.backend-batch-limit || '32' }}
          LUA_MUTATIONS: ${{ inputs.lua-mutations || false }}
          BACKEND: ${{ inputs.backend || 'all' }}
          MODE: ${{ inputs.mode || 'saturation' }}
          BATCH_SIZES: ${{ inputs.batch-sizes || '1' }}
        run: |
          mkdir -p results/local
          go build -trimpath -buildvcs=false -o .tools/weir-lab ./cmd/weir-lab
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          binary = pathlib.Path('.tools/weir-lab')
          server = pathlib.Path('.tools/weir')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if subprocess.check_output(['git', 'status', '--porcelain']):
              raise SystemExit('measurement requires a clean source checkout')
          server_receipt = json.loads(server.with_suffix('.receipt.json').read_text())
          server_sha = hashlib.sha256(server.read_bytes()).hexdigest()
          if server_receipt['sha256'] != server_sha:
              raise SystemExit('server binary does not match its preparation receipt')
          for backend_limit in os.environ['BACKEND_BATCH_LIMITS'].split(','):
              if not backend_limit.isdecimal() or not 1 <= int(backend_limit) <= 1024:
                  raise SystemExit('backend batch limits must be integers from 1 through 1024')
              output = 'results/local/saturation-batch-' + backend_limit
              command = [str(binary), '-mode', os.environ['MODE'], '-weir', str(server), '-backend', os.environ['BACKEND'], '-database-cpus', os.environ['DATABASE_CPUS'], '-backend-batch-limit', backend_limit, '-client-processes', '4', '-concurrency-levels', os.environ['CLIENT_LEVELS'], '-batch-sizes', os.environ['BATCH_SIZES'], '-records', '8192', '-payload-bytes', '1024', '-write-percent', os.environ['WRITE_PERCENT'], '-rounds', '3', '-warmup-duration', '10s', '-duration', '20s', '-output', output]
              if os.environ['LUA_MUTATIONS'] == 'true':
                  command.append('-lua-mutations')
              receipt = {'client_operation_timeout': '10s', 'host_memory_bytes': int(next(line for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:')).split()[1]) * 1024, 'host_cpus': os.cpu_count(), 'host_cpu_model': next(line.split(':', 1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name')), 'go': subprocess.check_output(['go', 'version'], text=True).strip(), 'host': platform.uname()._asdict(), 'source': source, 'source_dirty': False, 'client_binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(), 'client_build': subprocess.check_output(['go', 'version', '-m', str(binary)], text=True), 'server_binary_sha256': server_sha, 'server_receipt': server_receipt, 'versions': json.loads(pathlib.Path('versions.json').read_text()), 'command': command, 'workflow_run': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}
              receipt_path = pathlib.Path('results/local/measurement-batch-' + backend_limit + '.receipt.json')
              receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
              with pathlib.Path(output + '.log').open('x') as log:
                  process = subprocess.Popen(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      print(line, end='', flush=True)
                      log.write(line)
                  receipt['exit_code'] = process.wait()
              receipt['server_binary_after_sha256'] = hashlib.sha256(server.read_bytes()).hexdigest()
              receipt['client_binary_after_sha256'] = hashlib.sha256(binary.read_bytes()).hexdigest()
              receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
              if receipt['server_binary_after_sha256'] != server_sha or receipt['client_binary_after_sha256'] != receipt['client_binary_sha256']:
                  raise SystemExit('benchmark binary changed during measurement')
              if receipt['exit_code']:
                  raise SystemExit(receipt['exit_code'])
          PY
          git diff --exit-code
      - name: Preserve raw resource samples, workload validation and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saturation-evidence-writes-${{ matrix.write-percent }}-${{ github.sha }}
          path: |
            results/local/
            .tools/weir.receipt.json
            /tmp/weir-tests-*/manifest.json
            /tmp/weir-tests-*/cleanup.json
            /tmp/weir-tests-*/*config.json
            /tmp/weir-tests-*/*routes.json
            /tmp/weir-tests-*/*process.log
            /tmp/weir-tests-*/docker-engine.json
          retention-days: 14
