name: Database saturation benchmark

on:
  workflow_dispatch:
    inputs:
      write-percent:
        description: Deterministic write percentage (0 read, 10 mixed, 100 write)
        default: '0'
        required: true
        type: choice
        options: ['0', '10', '100']
      database-cpus:
        description: Owned Docker Search CPU quota; native Mongo uses all host CPUs
        default: '1'
        required: true
        type: choice
        options: ['1', '0.5', '2']
      client-levels:
        description: Total concurrency across four independent client processes
        default: '4,8,32,128,256'
        required: true
        type: string
      backend-batch-limit:
        description: Server adapter grouping limit (1 disables cross-RPC aggregation)
        default: '32'
        required: true
        type: choice
        options: ['32', '128', '256', '1']
      lua-mutations:
        description: Compare native single-record RMW with server-batched Lua mutations
        default: false
        required: true
        type: boolean
      backend:
        description: Owned database backend
        default: all
        required: true
        type: choice
        options: [all, mongo, search]
      mode:
        description: Single-record business requests or supplemental client bulk calls
        default: saturation
        required: true
        type: choice
        options: [saturation, bulk-saturation]
      batch-sizes:
        description: Records per call; saturation requires 1, bulk-saturation accepts 1 through 64
        default: '1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: saturation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  saturation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Prepare locked public tools and local images
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          python3 scripts/download_modules.py
          python3 scripts/prepare_weir.py
          python3 scripts/prepare_images.py
          if [ "$BACKEND" != search ]; then
            mongod=$(python3 scripts/prepare_native_mongo.py)
            printf 'WEIR_TEST_MONGODB_BINARY=%s\n' "$mongod" >> "$GITHUB_ENV"
          fi
      - name: Saturation benchmark
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          WRITE_PERCENT: ${{ inputs.write-percent }}
          DATABASE_CPUS: ${{ inputs.database-cpus }}
          CLIENT_LEVELS: ${{ inputs.client-levels }}
          BACKEND_BATCH_LIMIT: ${{ inputs.backend-batch-limit }}
          LUA_MUTATIONS: ${{ inputs.lua-mutations }}
          BACKEND: ${{ inputs.backend }}
          MODE: ${{ inputs.mode }}
          BATCH_SIZES: ${{ inputs.batch-sizes }}
        run: |
          arguments=(-mode "$MODE" -weir .tools/weir -backend "$BACKEND" -database-cpus "$DATABASE_CPUS"
            -backend-batch-limit "$BACKEND_BATCH_LIMIT" -client-processes 4 -concurrency-levels "$CLIENT_LEVELS"
            -batch-sizes "$BATCH_SIZES" -records 8192 -payload-bytes 1024 -write-percent "$WRITE_PERCENT"
            -rounds 3 -warmup-duration 10s -duration 20s -output results/local/saturation)
          if [ "$LUA_MUTATIONS" = true ]; then
            arguments+=(-lua-mutations)
          fi
          mkdir -p results/local
          go run ./cmd/weir-lab "${arguments[@]}" 2>&1 | tee results/local/saturation.log
      - name: Upload results and fixture logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saturation-${{ github.run_id }}
          path: |
            results/local/
            /tmp/weir-tests-*/*.json
            /tmp/weir-tests-*/*.log
          retention-days: 14
