name: Search write batching coverage

on:
  workflow_dispatch:
    inputs:
      server-source:
        description: Full immutable Weir commit
        type: string
        required: true
      phase:
        description: Fixed finite calibration or independent confirmation
        type: choice
        required: true
        options: [calibration, formal]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: batchstream/weir
          ref: ${{ inputs.server-source }}
          path: .tools/write-source
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Freeze immutable server and prepare owned fixtures
        env:
          SERVER_SOURCE: ${{ inputs.server-source }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          source = os.environ['SERVER_SOURCE']
          if re.fullmatch('[0-9a-f]{40}', source) is None:
              raise SystemExit('server-source must be a full immutable commit')
          actual = subprocess.check_output(['git', '-C', '.tools/write-source', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != source:
              raise SystemExit('immutable server source mismatch')
          PY
          python3 scripts/download_modules.py
          python3 scripts/prepare_images.py
          (cd .tools/write-source && go mod download && go mod verify)
          python3 scripts/build_local_server.py --source .tools/write-source --output .tools/write-weir
          go build -trimpath -buildvcs=false -o .tools/weir-lab ./cmd/weir-lab
      - name: Single-record callers and native baseline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          WRITE_PHASE: ${{ inputs.phase }}
        run: |
          python3 scripts/run_write_batching.py --phase "$WRITE_PHASE"
          git diff --exit-code
      - name: Retain positive and negative evidence with cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: write-batching-${{ github.sha }}-${{ inputs.phase }}
          path: |
            results/local/write-batching/
            .tools/write-weir.receipt.json
            .tools/write-weir.source/source.diff
            /tmp/weir-tests-*/manifest.json
            /tmp/weir-tests-*/cleanup.json
            /tmp/weir-tests-*/*config.json
            /tmp/weir-tests-*/*routes.json
            /tmp/weir-tests-*/*process.log
            /tmp/weir-tests-*/docker-engine.json
          retention-days: 14
