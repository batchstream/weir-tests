name: Crawler database throughput

on:
  workflow_dispatch:
    inputs:
      current-source:
        description: Full immutable current Weir commit
        required: true
        default: '4fe287e5915766ec3f48c8f42abde6b884d89bdd'
        type: string
      optimized-source:
        description: Full immutable optimized Weir commit
        required: true
        type: string
      after-max-in-flight:
        description: Optimized adapter batch cap (0 unlimited; explicit experiment only)
        required: true
        default: '0'
        type: string
      after-batch-max-wait:
        description: Optimized batching max_wait; explicit collection window
        required: true
        default: '0s'
        type: choice
        options: ['0s', '5ms', '20ms']
      after-batch-max-operations:
        description: Optimized batching max_operations (1 through 1024)
        required: true
        default: '32'
        type: string
      after-batch-max-bytes:
        description: Optimized batching max_bytes in bytes (up to 33554432)
        required: true
        default: '8388608'
        type: string
      visibility:
        description: Completion policy; application_acknowledged requires partial-update
        required: true
        default: query_visible
        type: choice
        options: [query_visible, application_acknowledged]
      seed-padding-bytes:
        description: Additional untouched partial-update product payload bytes
        required: true
        default: '0'
        type: string
      profiles:
        description: Crawler business rules or exclusive partial-update batching mechanism
        required: true
        default: two-step
        type: choice
        options: [two-step, combined, 'combined,two-step', partial-update]
      input-shape:
        description: Single-record native updates and SDK calls or explicit page-batch control
        required: true
        default: single
        type: choice
        options: [single, page]
      http-observer:
        description: Enable HTTP ledger or bypass observer on every path for direct control
        required: true
        default: disabled
        type: choice
        options: [enabled, disabled]
      modes:
        description: Run fixed-rate cases, saturation cases, or both independently
        required: true
        default: fixed-rate
        type: choice
        options: [fixed-rate, saturation, both]
      rates:
        description: Offered product rates (use none to disable fixed-rate cases)
        required: false
        default: '4,16,48'
        type: string
      concurrency-levels:
        description: Total workers across four OS clients (max 2048; fixed-rate uses the largest level)
        required: true
        default: '128'
        type: string
      page-size:
        description: Products/page (two seller mutations per product)
        required: true
        default: '1'
        type: string
      duration:
        description: Arrival duration per stage (use 120s for formal steady-state diagnostics)
        required: true
        default: '20s'
        type: string
      warmup:
        description: Warmup per stage
        required: true
        default: '10s'
        type: string
      rounds:
        description: Three-way rotating rounds
        required: true
        default: '3'
        type: choice
        options: ['1', '3']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOENV: 'off'
  GOWORK: 'off'
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  same-runner-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Prepare immutable servers and owned databases
        env:
          CURRENT_SOURCE: ${{ inputs.current-source }}
          OPTIMIZED_SOURCE: ${{ inputs.optimized-source }}
        run: |
          python3 scripts/download_modules.py
          python3 scripts/prepare_images.py
          python3 scripts/prepare_crawler_servers.py --current "$CURRENT_SOURCE" --optimized "$OPTIMIZED_SOURCE"
          go build -trimpath -buildvcs=false -o .tools/weir-crawler ./cmd/weir-crawler
      - name: Calibrated native and two Weir crawler paths
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          CRAWLER_MAX_IN_FLIGHT: ${{ inputs.after-max-in-flight }}
          CRAWLER_BATCH_MAX_WAIT: ${{ inputs.after-batch-max-wait }}
          CRAWLER_BATCH_MAX_OPERATIONS: ${{ inputs.after-batch-max-operations }}
          CRAWLER_BATCH_MAX_BYTES: ${{ inputs.after-batch-max-bytes }}
          CRAWLER_VISIBILITY: ${{ inputs.visibility }}
          CRAWLER_SEED_PADDING_BYTES: ${{ inputs.seed-padding-bytes }}
          CRAWLER_PROFILES: ${{ inputs.profiles }}
          CRAWLER_INPUT_SHAPE: ${{ inputs.input-shape }}
          CRAWLER_HTTP_OBSERVER: ${{ inputs.http-observer }}
          CRAWLER_MODES: ${{ inputs.modes }}
          CRAWLER_RATES: ${{ inputs.rates }}
          CRAWLER_LEVELS: ${{ inputs.concurrency-levels }}
          CRAWLER_PAGE_SIZE: ${{ inputs.page-size }}
          CRAWLER_DURATION: ${{ inputs.duration }}
          CRAWLER_WARMUP: ${{ inputs.warmup }}
          CRAWLER_ROUNDS: ${{ inputs.rounds }}
        run: |
          mkdir -p results/local
          python3 scripts/run_crawler.py
          git diff --exit-code
      - name: Reconstruct persisted expectations and all observation rows offline
        if: always()
        run: |
          if [ -f results/local/crawler.json ]; then
            python3 scripts/summarize_crawler.py --report results/local/crawler.json --output results/local/crawler-observations
            .tools/weir-crawler audit results/local/crawler.json
          fi
      - name: Preserve every stage, failure, receipt and owned cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crawler-evidence-${{ github.sha }}
          path: |
            results/local/crawler*
            .tools/weir-current.receipt.json
            .tools/weir-optimized.receipt.json
            /tmp/weir-tests-*/manifest.json
            /tmp/weir-tests-*/cleanup.json
            /tmp/weir-tests-*/*config.json
            /tmp/weir-tests-*/*routes.json
            /tmp/weir-tests-*/*process.log
            /tmp/weir-tests-*/search-log-receipt.json
            /tmp/weir-tests-*/docker-engine.json
          retention-days: 30
